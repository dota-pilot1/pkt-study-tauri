name: PKT Study Tauri Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish Windows assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify release version
        shell: bash
        run: |
          APP_VERSION="v$(node -p "require('./package.json').version")"
          TAURI_VERSION="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${{ inputs.release_tag }}" != "$APP_VERSION" ] || [ "${{ inputs.release_tag }}" != "$TAURI_VERSION" ]; then
            echo "::error::Release tag and app versions do not match."
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ inputs.release_tag }}
          releaseName: "PKT Study ${{ inputs.release_tag }}"
          releaseBody: "macOS는 로컬 빌드·공증하고 Windows는 GitHub Actions에서 빌드한 PKT Study 릴리즈입니다."
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"
